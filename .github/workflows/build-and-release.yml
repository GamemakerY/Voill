name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            os: 'linux'
          - platform: 'windows-latest'
            os: 'windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v2
        with:
          python-version: '3.10'
          enable-cache: true

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y libsoup-3.0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev portaudio19-dev

      # Build Python Sidecar (Linux)
      - name: Build Python Sidecar (Linux)
        if: matrix.os == 'linux'
        run: |
          cd backend
          uv sync
          uv run --with pyinstaller pyinstaller --onefile --clean --name api --add-data "prompts:prompts" main.py
          TARGET_TRIPLE=$(rustc -Vv | grep host | cut -d ' ' -f 2)
          mkdir -p ../frontend/src-tauri/binaries
          cp dist/api "../frontend/src-tauri/binaries/api-$TARGET_TRIPLE"
          chmod +x "../frontend/src-tauri/binaries/api-$TARGET_TRIPLE"

      # Build Python Sidecar (Windows)
      - name: Build Python Sidecar (Windows)
        if: matrix.os == 'windows'
        shell: powershell
        run: |
          cd backend
          uv sync
          uv run --with pyinstaller pyinstaller --onefile --clean --name api --add-data "prompts:prompts" main.py
          $TARGET_TRIPLE = (rustc -Vv | Select-String "host:").Line.Split(" ")[1]
          if (!(Test-Path "..\frontend\src-tauri\binaries")) { New-Item -ItemType Directory -Path "..\frontend\src-tauri\binaries" }
          copy dist\api.exe "..\frontend\src-tauri\binaries\api-$TARGET_TRIPLE.exe"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './frontend'
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: 'See commits for changes.'
          releaseDraft: true
          prerelease: false