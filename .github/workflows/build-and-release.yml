name: Build and Release Executables

on:
  push:
    tags:
      - '*' 

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Voill_Linux
            asset_name: Voill_Linux
          - os: windows-latest
            artifact_name: Voill_Windows.exe
            asset_name: Voill_Windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/python-version@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --onefile --name="${{ matrix.artifact_name }}" voill.py

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}